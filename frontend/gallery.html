<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Muse · 双端对照</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17171b;
        --panel: #1d1d23;
        --border: #32323a;
        --text: #e9e9ec;
        --muted: #9b9ba5;
        --accent: #7c5cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        color: var(--muted);
      }
      .hint code {
        color: var(--text);
      }
      .spacer {
        flex: 1;
      }
      .sizes {
        display: flex;
        gap: 4px;
      }
      .sizes button {
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .sizes button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--text);
      }
      main {
        flex: 1;
        display: flex;
        gap: 1px;
        min-height: 0;
        background: var(--border);
      }
      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }
      .pane > h2 {
        margin: 0;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      .frame {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        background: #0f0f12;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }
      /* The phone pane is capped to a device width so the mobile layout is
         judged at the size it is designed for, not at whatever the window is. */
      .pane.phone .frame {
        padding: 12px 0;
      }
      .pane.phone iframe {
        width: var(--phone-width, 390px);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Muse · 双端对照</h1>
      <span class="hint">
        左：桌面端（Wails 绑定）　右：局域网移动端（HTTP，来自 <code>:8899</code> 的构建产物）
      </span>
      <span class="spacer"></span>
      <span class="hint">仅开发时使用 · 需 <code>wails dev</code> 且已 <code>npm run build:mobile</code></span>
      <span class="sizes" role="group" aria-label="移动端视口宽度">
        <button type="button" data-width="390" aria-pressed="true">390</button>
        <button type="button" data-width="430" aria-pressed="false">430</button>
        <button type="button" data-width="768" aria-pressed="false">768</button>
      </span>
    </header>
    <main>
      <section class="pane">
        <h2>桌面端 · /</h2>
        <div class="frame"><iframe src="/" title="桌面端"></iframe></div>
      </section>
      <section class="pane phone">
        <h2>移动端 · 127.0.0.1:8899</h2>
        <div class="frame">
          <iframe id="phone" src="http://127.0.0.1:8899/" title="移动端"></iframe>
        </div>
      </section>
    </main>
    <script>
      // No framework and no build step: a pair of iframes plus a width switch.
      // This file is not an entry in vite.config, so `npm run build` never emits
      // it — it exists only while the dev server runs.
      const buttons = document.querySelectorAll("[data-width]");
      for (const button of buttons) {
        button.addEventListener("click", () => {
          for (const other of buttons) {
            other.setAttribute("aria-pressed", String(other === button));
          }
          document.documentElement.style.setProperty(
            "--phone-width",
            `${button.dataset.width}px`,
          );
        });
      }
    </script>
  </body>
</html>
